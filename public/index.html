<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>供应链风险雷达</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/style.css">
<link rel="preload" href="/vendor/worldmonitor/countries.geojson" as="fetch" crossorigin>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><h1>供应链风险雷达</h1><p>公开新闻归并为风险事件，并关联可能受影响的线路</p></div></div>
  <div class="topbar-controls">
    <div class="segmented" role="radiogroup" aria-label="数据来源">
      <label><input type="radio" name="mode" value="sample" checked><span>样例</span></label>
      <label><input type="radio" name="mode" value="live"><span>实时</span></label>
    </div>
    <button id="open-model-settings" type="button" aria-label="模型配置">模型配置</button>
    <label class="theme-control"><span class="visually-hidden">主题</span><select id="theme" aria-label="主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
  </div>
</header>
<dialog id="model-settings" aria-labelledby="model-settings-title">
  <form id="model-settings-form">
    <h2 id="model-settings-title">模型配置</h2>
    <p class="meta">OpenAI 兼容接口。用于生成实时运输中断的中文标题和进展。</p>
    <label for="model-profiles">已保存配置</label>
    <div class="model-profile-picker">
      <select id="model-profiles"></select>
      <button id="new-model-profile" type="button">新增配置</button>
    </div>
    <label for="model-profile-name">配置名称</label>
    <input id="model-profile-name" type="text" autocomplete="off" maxlength="60" required>
    <label for="model-base-url">Base URL</label>
    <input id="model-base-url" type="url" autocomplete="off" maxlength="500" required>
    <label for="model-id">Model ID</label>
    <input id="model-id" type="text" autocomplete="off" maxlength="200" placeholder="例如 deepseek-flash">
    <label for="model-api-key">API Key</label>
    <input id="model-api-key" type="password" autocomplete="new-password" maxlength="4096" aria-describedby="model-key-note">
    <p id="model-key-note" class="meta"></p>
    <label id="clear-model-key-row" hidden><input id="clear-model-key" type="checkbox"> 删除已存密钥</label>
    <p id="model-settings-status" class="meta" role="status"></p>
    <div class="model-settings-actions">
      <button id="close-model-settings" type="button">关闭</button>
      <button id="activate-model-profile" type="button" disabled>启用此配置</button>
      <button id="save-model-settings" type="submit" disabled>保存</button>
    </div>
  </form>
</dialog>
<main>
  <section class="toolbar" aria-label="数据筛选">
    <input id="search" type="search" placeholder="搜索事件、地点、线路或类别" aria-label="搜索">
    <select id="region" aria-label="区域"><option value="">全部区域</option></select>
    <select id="sort" aria-label="排序"><option value="spatial">地理走廊</option><option value="newest">最新更新</option><option value="routes">关联线路最多</option></select>
    <button id="refresh" type="button">刷新</button>
    <button id="translate" type="button" aria-pressed="false" hidden>翻译成中文</button>
    <button id="export" type="button" disabled>导出 JSON</button>
  </section>
  <section class="summary" aria-label="概况">
    <dl id="stats"></dl>
    <p id="status" role="status"></p>
  </section>
  <details id="network-data" hidden>
    <summary id="network-label">线路与节点</summary>
    <p id="network-status" role="status"></p>
    <div id="network-tables"></div>
  </details>
  <div class="workspace">
    <section id="event-list" aria-labelledby="events-title" hidden><h2 id="events-title" class="section-title">事件</h2><div id="items"></div></section>
    <aside id="map-view" aria-labelledby="map-title" hidden>
      <h2 id="map-title" class="section-title">区域分布</h2>
      <div id="map-regions" class="map-regions" role="toolbar" aria-label="区域分布切换"></div>
      <div id="risk-map"><canvas width="960" height="440" aria-hidden="true"></canvas><div id="map-markers"></div><div class="map-controls" role="group" aria-label="地图缩放控制"><button id="map-zoom-in" type="button" class="map-ctrl-btn" title="放大地图" aria-label="放大地图">+</button><button id="map-zoom-out" type="button" class="map-ctrl-btn" title="缩小地图" aria-label="缩小地图">−</button><button id="map-reset" type="button" class="map-ctrl-btn map-reset-btn" title="重置全球视图" hidden>重置</button></div></div>
      <p id="map-note"></p>
      <details id="sources" hidden>
        <summary>数据来源</summary>
        <ul id="source-status"></ul>
      </details>
    </aside>
  </div>
</main>
<script type="module" src="/app.js"></script></html>
