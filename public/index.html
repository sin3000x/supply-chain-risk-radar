<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>外部事件情报</title><link rel="stylesheet" href="/style.css">
<header><label class="theme-control">主题 <select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><div class="eyebrow">RISK INTELLIGENCE / DEMO 01</div><h1>外部事件情报</h1><p>从新闻发现事件，从运行信号观察变化，从预测看下一步。</p></header>
<main><section class="toolbar" aria-label="数据筛选"><label>数据来源 <select id="mode"><option value="sample">虚构样例</option><option value="live">实时数据</option></select></label><label>包含 <select id="kind"><option value="">全部类型</option><option value="news">新闻</option><option value="signal">观测信号</option><option value="forecast">预测</option></select></label><input id="search" type="search" placeholder="搜索事件、地点或类别" aria-label="搜索"><button id="refresh">刷新</button><button id="export" disabled>导出 JSON</button></section>
<p id="status" role="status"></p><section id="items" aria-label="外部情报记录"></section></main><script type="module" src="/app.js"></script></html>
