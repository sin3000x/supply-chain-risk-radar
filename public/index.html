<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>供应链风险雷达</title><link rel="stylesheet" href="/style.css">
<header class="page-header"><label class="theme-control">主题 <select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><h1>供应链风险雷达</h1></header>
<main><section class="toolbar" aria-label="数据筛选"><select id="mode" aria-label="数据来源"><option value="sample">样例数据</option><option value="live">实时数据</option></select><select id="kind" aria-label="事件类型"><option value="">全部类型</option><option value="news">新闻</option><option value="signal">观测信号</option><option value="forecast">预测</option></select><select id="sort" aria-label="排序"><option value="newest">最新更新</option><option value="routes">关联线路最多</option></select><select id="region" aria-label="区域"><option value="">全部区域</option></select><input id="search" type="search" placeholder="搜索事件、地点或类别" aria-label="搜索"><button id="refresh">刷新</button><button id="export" disabled>导出 JSON</button></section>
